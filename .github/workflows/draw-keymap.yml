name: Draw Keymap

on:
  workflow_dispatch:  # Manual trigger
  push:
    paths:
      - 'config/*.keymap'
      - 'config/**/*.dtsi'
      - 'keymap_drawer.config.yaml'
  pull_request:
    paths:
      - 'config/*.keymap'
      - 'config/**/*.dtsi'

jobs:
  draw:
    uses: caksoylar/keymap-drawer/.github/workflows/draw-zmk.yml@main
    with:
      keymap_patterns: "config/adv360.keymap"
      config_path: "keymap_drawer.config.yaml"
      output_folder: "keymap-img"
