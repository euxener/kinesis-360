name: Draw Keymap

on:
  workflow_dispatch:  # Manual trigger
  push:
    paths:
      - 'config/*.keymap'
      - 'config/**/*.dtsi'
      - 'keymap_drawer.config.yaml'
      - 'bin/cheatsheet.py'
  pull_request:
    paths:
      - 'config/*.keymap'
      - 'config/**/*.dtsi'

jobs:
  draw:
    # Pinned: the release commit and the same PyPI version, bump both together
    # (and DRAWER in bin/cheatsheet.py, KEYMAP_DRAWER below)
    uses: caksoylar/keymap-drawer/.github/workflows/draw-zmk.yml@a44809b8cc718cbff646641f49a8f71a9368336d # v0.23.0
    with:
      install_version: "0.23.0"
      keymap_patterns: "config/adv360.keymap"
      config_path: "keymap_drawer.config.yaml"
      output_folder: "keymap-img"

  # keymap-custom/: the print-ready PDF (bin/cheatsheet.py) and the dark PNG,
  # committed like keymap-img so they never lag the keymap. Runs after draw and
  # checks out the branch tip, so its commit lands on top of draw's.
  custom:
    needs: draw
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    env:
      KEYMAP_DRAWER: keymap-drawer==0.23.0
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
      - name: Install librsvg, poppler and JetBrains Mono
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends librsvg2-bin poppler-utils fonts-jetbrains-mono
      - name: Render the cheatsheet
        run: bin/cheatsheet.py letter
      - name: Render my_keymap (yaml, svg, png on the theme's background)
        run: |
          uvx --from "$KEYMAP_DRAWER" keymap -c keymap_drawer.config.yaml parse -z config/adv360.keymap > keymap-custom/my_keymap.yaml
          uvx --from "$KEYMAP_DRAWER" keymap -c keymap_drawer.config.yaml draw keymap-custom/my_keymap.yaml > keymap-custom/my_keymap.svg
          rsvg-convert -b '#1a1a2e' keymap-custom/my_keymap.svg -o keymap-custom/my_keymap.png
      - uses: stefanzweifel/git-auto-commit-action@b863ae1933cb653a53c021fe36dbb774e1fb9403 # v5
        with:
          commit_message: keymap-custom render
          file_pattern: keymap-custom/*
