    "&mcb_quick_save": { t: 'Save', h: 'file' }
    "&mcb_expand_grp": { t: '+Grp', h: 'outline' }
    "&mcb_collapse_grp": { t: '−Grp', h: 'outline' }
    "&mcb_super_find": { t: 'Find', h: 'super' }
    "&mcb_insert_note": { t: 'Note', h: 'insert' }
    "&mcb_zoom_in": { t: '+', h: 'zoom' }
    "&mcb_zoom_out": { t: '−', h: 'zoom' }
    "&mcb_insert_row": { t: '+Row', h: 'insert' }
    "&mcb_delete_row": { t: '−Row', h: 'delete' }
    "&mcb_insert_col": { t: '+Col', h: 'insert' }
    "&mcb_delete_col": { t: '−Col', h: 'delete' }
    "&mcb_paste_insert": { t: 'Ins', h: 'paste' }

    # System
    "&studio_unlock": "Studio"
    "&stp STP_BAT": "Battery"
    "&bootloader": "Boot"
    "&bt BT_CLR": "BT Clear"
    "&bl BL_TOG": "BL Tog"
    "&bl BL_INC": "BL +"
    "&bl BL_DEC": "BL -"
    "&rgb_ug RGB_TOG": "RGB"

    # Common keys
    "&kp C_VOL_UP": '$$mdi:volume-plus$$'
    "&kp C_VOL_DN": '$$mdi:volume-minus$$'
    "&kp C_MUTE": '$$mdi:volume-mute$$'
    "&kp C_PP": '$$mdi:play-pause$$'
    "&kp C_PREV": '$$mdi:skip-previous$$'
    "&kp C_NEXT": '$$mdi:skip-next$$'
    "&kp C_BRI_UP": '$$mdi:brightness-7$$'
    "&kp C_BRI_DN": '$$mdi:brightness-5$$'
    "&kp C_AL_CALC": "Calc"

  # ZMK behavior mappings
  zmk_combos: {}
  zmk_keycode_map:
    EXCL: "!"
    HASH: "#"
    AT: "@"
    CARET: "^"
    DLLR: "$"
    PRCNT: "%"
    AMPS: "&"
    UNDER: "_"
    PLUS: "+"
    ASTRK: "*"
    GRAVE: "`"
    FSLH: "/"
