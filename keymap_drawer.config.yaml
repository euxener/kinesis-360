# Keymap Drawer Configuration for Kinesis Advantage 360
# https://github.com/caksoylar/keymap-drawer

draw_config:
  # Key size and spacing
  key_w: 66
  key_h: 60
  # $$mdi:...$$ icons (media, lock, snip), drawn at roughly the legend's height
  glyph_tap_size: 18
  split_gap: 30

  # Styling
  outer_pad_w: 10
  outer_pad_h: 10

  # Dark theme on top of keymap-drawer's built-in style. svg_extra_style, not
  # svg_style: svg_style replaces the built-in one and drops its text centering
  svg_extra_style: |
    svg {
      background-color: #1a1a2e;
    }
    /* On text, not svg: the built-in style sets the font on text. Ubuntu's
       fonts-jetbrains-mono is "JetBrains Mono", Omarchy ships the Nerd build.
       Same list in bin/cheatsheet.py */
    text {
      font-family: "JetBrains Mono", "JetBrainsMono Nerd Font", "JetBrainsMono NF", monospace;
    }
    rect.key {
      fill: #16213e;
      stroke: #0f3460;
      stroke-width: 1;
      rx: 6;
    }
    rect.key.held {
      fill: #533483;
    }
    text {
      fill: #e4e4e4;
    }
    use.glyph {
      fill: #e4e4e4;
    }
    text.label {
      fill: #00d9ff;
      stroke: #1a1a2e;
    }
    text.tap {
      font-size: 13px;
    }
    text.hold {
      font-size: 10px;
      fill: #ff6b6b;
    }
    rect.combo {
      fill: #2d4059;
    }

  # Show hold-tap behaviors
  separate_combo_diagrams: true
  combo_w: 28
  combo_h: 22

parse_config:
  # Mapping for special keys to display nicely
  raw_binding_map:
    # Layer keys: none here. keymap-drawer names &mo/&tog after the layer they reach and
    # highlights the held key on each layer; a fixed label here would undo both

    # Programming macros added with the six-layer plan
    "&pm_squotes": "''"
    "&pm_dquotes": '""'
    "&pm_backticks": "``"
    "&pm_fence": "```"
    "&pm_strict_eq": "==="
    "&pm_strict_neq": "!=="
    "&pm_shell_var": "${}"
    "&pm_parent_dir": "../"
    "&pm_home_dir": "~/"
    # Right Alt is the accent key (Right Option on macOS, AltGr on Linux): the
    # bottom-right corner, 75, and I's hold (keymap-drawer labels hold-tap holds as &kp too)
    "&kp RALT": "AltGr"
    # Tap does nothing, a double tap toggles Caps Lock (td_caps in the keymap)
    "&td_caps": { t: "Caps", s: "2×" }
    "&pm_substitute": ":%s/"
    "&pm_go_assign": ":="
    "&pm_go_chan": "<-"
    "&pm_pipe": "|>"

    # Shifted symbols, written as LS(...) in the keymap
    "&kp LS(FSLH)": "?"
    "&kp LS(SEMI)": ":"
    "&kp LS(SQT)": "\""
    "&kp LS(LBKT)": "{"
    "&kp LS(RBKT)": "}"
    "&kp LS(COMMA)": "<"
    "&kp LS(DOT)": ">"
    "&kp LS(BSLH)": "|"
    "&kp LS(GRAVE)": "~"
    "&kp LS(N9)": "("
    "&kp LS(N0)": ")"

    # Macros - Programming
    "&pm_parens": "()"
    "&pm_braces": "{}"
    "&pm_brackets": "[]"
    "&pm_angles": "<>"
    "&pm_arrow": "->"
    "&pm_fat_arrow": "=>"
    "&pm_eq": "=="
    "&pm_neq": "!="
    "&pm_lte": "<="
    "&pm_gte": ">="
    "&pm_and": "&&"
    "&pm_or": "||"
    "&pm_scope": "::"
    "&pm_line_comment": "//"
    "&pm_block_comment": "/**/"

    # Macros - Spanish

    # Macros - OS shortcuts
    "&Win_Lock_PC": { t: '$$mdi:lock$$', h: Win }
    "&Win_Snip_Tool": { t: '$$mdi:camera$$', h: Win }
    "&Mac_Lock_PC": { t: '$$mdi:lock$$', h: Mac }
    "&Mac_Snip_Tool": { t: '$$mdi:camera$$', h: Mac }
    "&macro_ver": "Version"
    "&Double_Click": { t: '$$mdi:mouse$$', h: 2× click }

    # Macros - Excel/Macabacus
    "&mcb_num_cycle": { t: '#', h: 'format' }
    "&mcb_pct_cycle": { t: '%', h: 'format' }
    "&mcb_mult_cycle": { t: '×', h: 'format' }
    "&mcb_date_cycle": { t: 'Date', h: 'format' }
    "&mcb_anchor_cycle": { t: '$', h: 'anchor' }
    "&mcb_binary_cycle": { t: 'Y/N', h: 'format' }
    "&mcb_inc_dec": { t: '.0+', h: 'decimal' }
    "&mcb_dec_dec": { t: '.0−', h: 'decimal' }
    "&mcb_shift_dec_left": { t: '←.', h: 'decimal' }
    "&mcb_shift_dec_right": { t: '.→', h: 'decimal' }
    "&mcb_blue_black": { t: 'B/K', h: 'font' }
    "&mcb_color_cycle": { t: 'Font', h: 'color' }
    "&mcb_fill_cycle": { t: 'Fill', h: 'color' }
    "&mcb_autocolor": { t: 'Auto', h: 'color' }
    "&mcb_center_cycle": { t: 'Ctr', h: 'align' }
    "&mcb_horiz_cycle": { t: '↔', h: 'align' }
    "&mcb_vert_cycle": { t: '↕', h: 'align' }
    "&mcb_top_border": { t: '▔', h: 'border' }
    "&mcb_bottom_border": { t: '▁', h: 'border' }
    "&mcb_left_border": { t: '▏', h: 'border' }
    "&mcb_right_border": { t: '▕', h: 'border' }
    "&mcb_outside_borders": { t: '□', h: 'border' }
    "&mcb_inside_borders": { t: '⊞', h: 'border' }
    "&mcb_fill_right": { t: '→', h: 'fill' }
