    # Keypad
    KP_NUM: "Num"
    KP_EQUAL: "="
    KP_DIVIDE: "÷"
    KP_MULTIPLY: "×"
    KP_MINUS: "-"
    KP_PLUS: "+"
    KP_ENTER: "↵"
