# Keymap Drawer Configuration for Kinesis Advantage 360
# https://github.com/caksoylar/keymap-drawer

draw_config:
  # Key size and spacing
  key_w: 60
  key_h: 56
  split_gap: 30

  # Styling
  outer_pad_w: 10
  outer_pad_h: 10

  # Font settings
  key_font_size: 14
  header_font_size: 16

  # Colors - dark theme
  svg_style: |
    svg {
      font-family: "Inter", "Helvetica Neue", Helvetica, Arial, sans-serif;
      background-color: #1a1a2e;
    }
    rect.key {
      fill: #16213e;
      stroke: #0f3460;
      stroke-width: 1;
      rx: 6;
    }
    rect.key.held {
      fill: #533483;
    }
    text {
      fill: #e4e4e4;
    }
    text.label {
      fill: #00d9ff;
    }
    text.tap {
      font-size: 13px;
    }
    text.hold {
      font-size: 10px;
      fill: #ff6b6b;
    }
    rect.combo {
      fill: #2d4059;
    }

  # Show hold-tap behaviors
  separate_combo_diagrams: true
  combo_w: 28
  combo_h: 22

