    AT: "@"
    CARET: "^"
    DLLR: "$"
    PRCNT: "%"
    AMPS: "&"
    UNDER: "_"
    PLUS: "+"
    ASTRK: "*"
    GRAVE: "`"
    FSLH: "/"
    BSPC: "⌫"
    DEL: "Del"
    RET: "↵"
    ENTER: "↵"
    SPACE: "␣"
    TAB: "⇥"
    ESC: "Esc"
    CAPS: "Caps"

    # Arrows
    UP: "↑"
    DOWN: "↓"
    LEFT: "←"
    RIGHT: "→"

    # Navigation
    PG_UP: "PgUp"
    PG_DN: "PgDn"
    HOME: "Home"
    END: "End"

    # Modifiers (display names)
    LSHFT: "⇧"
    RSHFT: "⇧"
    LCTRL: "Ctrl"
    RCTRL: "Ctrl"
    LALT: "Alt"
    RALT: "Alt"
    LGUI: "⌘"
    RGUI: "⌘"

    # Symbols
    MINUS: "-"
    EQUAL: "="
    LBKT: "["
    RBKT: "]"
    BSLH: "\\"
    SEMI: ";"
    SQT: "'"
    GRAVE: "`"
    COMMA: ","
    DOT: "."
    FSLH: "/"

    # Keypad
    KP_NUM: "NumLk"
    KP_EQUAL: "="
    KP_DIVIDE: "÷"
    KP_MULTIPLY: "×"
    KP_MINUS: "-"
    KP_PLUS: "+"
    KP_ENTER: "↵"
    KP_DOT: "."
    # plain digits, not keymap-drawer's two-line "KP 7"; Num+Fn is the only numpad
    KP_N0: "0"
    KP_N1: "1"
    KP_N2: "2"
    KP_N3: "3"
    KP_N4: "4"
    KP_N5: "5"
    KP_N6: "6"
    KP_N7: "7"
    KP_N8: "8"
    KP_N9: "9"
